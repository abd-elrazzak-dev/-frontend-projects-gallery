<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abderrazzak.dev - Nature Profile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg-color: #050d09;
            --card-bg: rgba(29, 37, 33, 0.281);
            --card-border: rgba(211, 110, 29, 0.2);
            --accent-primary: #D36E1D;
            --accent-gradient: linear-gradient(135deg, #E28941 0%, #a85311 100%);
            --text-main: #E8F0EA;
            --text-muted: #8FA697;
            --input-bg: rgba(5, 13, 9, 0.568);
            --input-border: rgba(143, 166, 151, 0.15);
        }





        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Using the requested background image */
            background-image: url('00.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            color: var(--text-main);
            overflow: hidden;
        }

            body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(5, 13, 9, 0.8), rgba(10, 26, 18, 0.95));
            z-index: 1;
        }


        /* Glassmorphism Styles Refined */
        .glass-panel  {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            z-index: 2;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .glass-placeholder {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
border-top: 1px solid rgba(255, 255, 255, 0.08);
border-right: 1px solid rgba(255, 255, 255, 0.08);
border-bottom: 1px solid rgba(255, 255, 255, 0.08);
border-left: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-placeholder:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(217, 101, 27, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Profile Avatar Glow effect */
        .avatar-container {
            background: linear-gradient(135deg, #d9651b 0%, rgba(10, 30, 20, 0.8) 100%);
            padding: 4px;
            box-shadow: 0 10px 40px rgba(217, 101, 27, 0.3);
        }

        /* Animated Background Wave */
        .bg-wave-line {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 120%;
            height: 60%;
            background: linear-gradient(to right, transparent, rgba(217, 101, 27, 0.06), transparent);
            transform: rotate(-15deg);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            70% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .animate-pop-in {
            animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Staggered Delays for elements */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center text-white relative overflow-hidden antialiased p-5 sm:p-8">
    
    <!-- Decorative background depth -->
    <div class="bg-wave-line"></div>

    <!-- Main Glass Profile Card -->
    <!-- Added w-full and max-w-[400px] to make it responsive but limited in max width, removing empty sides on mobile -->
    <div class="glass-panel w-full max-w-[400px] rounded-[2.5rem] p-7 pt-14 pb-8 relative flex flex-col items-center z-10 animate-fade-in-up">
        
        <!-- Profile Avatar -->
        <div class="absolute -top-14 avatar-container rounded-full w-[112px] h-[112px] flex items-center justify-center animate-pop-in delay-200">
            <div class="w-full h-full rounded-full overflow-hidden bg-black relative">
                <!-- Fallback gradient in case image doesn't load instantly -->
                <div class="absolute inset-0 bg-gradient-to-tr from-emerald-900 to-emerald-700 z-0"></div>
                <!-- Actual Image -->
                <img src="00.jpg" alt="Profile" class="w-full h-full object-cover relative z-10">
            </div>
        </div>

        <!-- Profile Info -->
        <div class="text-center mt-4 mb-8 w-full animate-fade-in-up delay-300">
            <h1 class="text-[26px] font-bold tracking-tight mb-2 text-white drop-shadow-lg">Abderrazzak.dev</h1>
            <p class="text-[14px] font-medium text-emerald-100/70 leading-snug px-4">
                "Hi, I am a Web Designer and Developer"
            </p>
        </div>






        <div class="grid grid-cols-2 gap-4 w-full mb-4 animate-fade-in-up delay-400">
            
            <!-- Login Page Button -->
            <a href="login.html" class="glass-placeholder h-[72px] rounded-[1.25rem] flex items-center justify-center gap-2.5">
                <i class="ph ph-sign-in text-[22px] text-[#d9651b]/90"></i>
                <span class="text-[15px] text-white/80 font-semibold tracking-wide">LoginPage</span>
            </a>

            <!-- Dribbble Button -->
            <a href="star.html" class="glass-placeholder h-[72px] rounded-[1.25rem] flex items-center justify-center gap-2.5">
                <i class="ph ph-sparkle text-[22px] text-[#d9651b]/90"></i>
                <span class="text-[15px] text-white/80 font-semibold tracking-wide">InTheStars</span>
            </a>
            
        </div>


        <!-- Secondary Links Grid (2 columns) -->
        <div class="grid grid-cols-2 gap-4 w-full mb-8 animate-fade-in-up delay-500">
            <a href="#" class="glass-placeholder h-[72px] rounded-[1.25rem] flex items-center justify-center gap-2.5">
                <i class="ph ph-briefcase text-[22px] text-[#d9651b]/90"></i>
                <span class="text-[15px] text-white/80 font-semibold tracking-wide">Portfolio</span>
            </a>
            <a href="#" class="glass-placeholder h-[72px] rounded-[1.25rem] flex items-center justify-center gap-2.5">
                <i class="ph ph-file-text text-[22px] text-[#d9651b]/90"></i>
                <span class="text-[15px] text-white/80 font-semibold tracking-wide">Resume</span>
            </a>
        </div>

        <!-- Contact Button -->
        <button class="w-full bg-[#d9651b] text-white font-bold text-[16px] py-[18px] rounded-full flex items-center justify-center gap-2 hover:bg-[#c25816] transition-all duration-300 shadow-[0_8px_24px_-6px_rgba(217,101,27,0.7)] hover:shadow-[0_12px_28px_-6px_rgba(217,101,27,0.9)] active:scale-[0.97] animate-fade-in-up delay-500">
            <i class="ph-fill ph-paper-plane-tilt text-[24px]"></i>
            Contact me
        </button>
        
    </div>

</body>
</html>
