<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Projects</title>
    <style>
        :root {
            --bg1: #eef2f7;
            --bg2: #b8d2f0;
            --bg3: #ebc6f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(15, 23, 42, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #258feb;
            --accent2: #0ecce9;
            --btn-bg: var(--accent);
            --btn-hover-bg: var(--accent2);
            --on-accent: #ffffff;
            --gap: 1rem;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .page-header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 3rem auto;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        .projects-grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--gap);
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            width: calc(50% - (var(--gap) / 2));
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.15);
            border-color: var(--accent);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: var(--bg1);
            border-radius: 10px;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1rem 1rem 0.5rem 1rem;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1rem 1rem 1rem;
            margin-top: auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--btn-bg);
            color: var(--on-accent);
            text-decoration: none;
            border-radius: 8px;
            height: 40px;
            width: 40px;
            overflow: hidden;
            transition: width var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1), background-color var(--transition-speed) ease, padding var(--transition-speed) ease;
            white-space: nowrap;
            padding: 0;
        }

        .btn:hover {
            background-color: var(--btn-hover-bg);
            width: 110px;
            justify-content: flex-start;
            padding-left: 12px;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .btn span {
            font-size: 0.875rem;
            font-weight: 700;
            opacity: 0;
            width: 0;
            overflow: hidden;
            transition: opacity var(--transition-speed) ease, width var(--transition-speed) ease, margin-left var(--transition-speed) ease;
        }

        .btn:hover span {
            opacity: 1;
            width: auto;
            margin-left: 8px;
        }

        @media (min-width: 640px) {
            :root {
                --gap: 1.5rem;
            }
            .card {
                width: calc(33.333% - (var(--gap) * 2 / 3));
            }
            .page-header h1 {
                font-size: 3rem;
            }
        }

        @media (min-width: 1024px) {
            .card {
                width: calc(20% - (var(--gap) * 4 / 5));
            }
        }
    </style>
</head>
<body>
