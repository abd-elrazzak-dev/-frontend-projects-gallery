<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abderrazzak.dev - Profile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --card-bg: rgba(29, 37, 33, 0.28);
      --card-border: rgba(211, 110, 29, 0.2);
      --text-main: #e8f0ea;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-main);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(5, 13, 9, 0.8), rgba(10, 26, 18, 0.95));
      z-index: 1;
    }

    .glass-panel {
      width: 90%;
      max-width: 420px;
      padding: 40px 30px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .glass-placeholder {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.02);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-placeholder:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(217, 101, 27, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .avatar-container {
      background: linear-gradient(135deg, #d9651b 0%, rgba(10, 30, 20, 0.8) 100%);
      padding: 4px;
      box-shadow: 0 10px 40px rgba(217, 101, 27, 0.3);
    }

    .bg-wave-line {
      position: absolute;
      top: 20%;
      left: -10%;
      width: 120%;
      height: 60%;
      background: linear-gradient(to right, transparent, rgba(217, 101, 27, 0.06), transparent);
      transform: rotate(-15deg);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.6); }
      70% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .animate-fade-in-up {
      opacity: 0;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-pop-in {
      opacity: 0;
      animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }
  </style>
</head>
<body class="relative flex min-h-screen w-full items-center justify-center overflow-hidden p-5 text-white antialiased sm:p-8">
  
  <div class="bg-wave-line"></div>

  <main class="glass-panel animate-fade-in-up relative z-10 flex w-full max-w-[400px] flex-col items-center rounded-[2.5rem] p-7 pb-8 pt-14">
    
    <div class="avatar-container animate-pop-in delay-200 absolute -top-14 flex h-[112px] w-[112px] items-center justify-center rounded-full">
      <div class="relative h-full w-full overflow-hidden rounded-full bg-black">
        <div class="absolute inset-0 z-0 bg-gradient-to-tr from-emerald-900 to-emerald-700"></div>
        <img src="00.jpg" alt="Profile" class="relative z-10 h-full w-full object-cover">
      </div>
    </div>

    <header class="animate-fade-in-up delay-300 mb-8 mt-4 w-full text-center">
      <h1 class="mb-2 text-[26px] font-bold tracking-tight text-white drop-shadow-lg">Abderrazzak.dev</h1>
      <p class="px-4 text-[14px] font-medium leading-snug text-emerald-100/70">
        Dedicated Front-End Developer building dynamic, highly responsive digital interfaces with a focus on clean code and modern UI aesthetics
      </p>
    </header>

    <section class="animate-fade-in-up delay-400 mb-4 grid w-full grid-cols-2 gap-4">
      <a href="Sign_In/signin.html" class="glass-placeholder flex h-[72px] items-center justify-center gap-2.5 rounded-[1.25rem]">
        <i class="ph ph-sign-in text-[22px] text-[#d9651b]/90"></i>
        <span class="text-[15px] font-semibold tracking-wide text-white/80">LoginPage</span>
      </a>

      <a href="Written_In_The_Stars/star.html" class="glass-placeholder flex h-[72px] items-center justify-center gap-2.5 rounded-[1.25rem]">
        <i class="ph ph-sparkle text-[22px] text-[#d9651b]/90"></i>
        <span class="text-[15px] font-semibold tracking-wide text-white/80">InTheStars</span>
      </a>
    </section>

    <section class="animate-fade-in-up delay-500 mb-8 grid w-full grid-cols-2 gap-4">
      <a href="Samsung_Store/store.html" class="glass-placeholder flex h-[72px] items-center justify-center gap-2.5 rounded-[1rem]">
        <i class="ph ph-storefront text-[22px] text-[#d9651b]/90"></i>
        <span class="text-[15px] font-semibold tracking-wide text-white/80">SamsungStore</span>
      </a>
      
      <a href="#" class="glass-placeholder flex h-[72px] items-center justify-center gap-2.5 rounded-[1.25rem]">
        <i class="ph ph-hourglass-medium text-[22px] text-[#d9651b]/90"></i>
        <span class="text-[15px] font-semibold tracking-wide text-white/80">Incoming...</span>
      </a>
    </section>

    <a href="Contact_Me/contact.html" class="animate-fade-in-up delay-500 flex w-full items-center justify-center gap-2 rounded-full bg-[#d9651b] py-[18px] text-[16px] font-bold text-white shadow-[0_8px_24px_-6px_rgba(217,101,27,0.7)] transition-all duration-300 hover:bg-[#c25816] hover:shadow-[0_12px_28px_-6px_rgba(217,101,27,0.9)] active:scale-[0.97]">
      <i class="ph-fill ph-paper-plane-tilt text-[24px]"></i>
      Contact me
    </a>
    
  </main>

</body>
</html>
